name: Publish website on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/v1.0 _site/v2.0
          if git rev-parse --verify 'v1.0^{commit}' >/dev/null 2>&1; then
            git archive v1.0 paginas | tar -x --strip-components=1 -C _site/v1.0
          else
            cp -R paginas/. _site/v1.0/
          fi
          cp -R img _site/img
          cp -R paginas/. _site/
          cp -R paginas/. _site/v2.0/
          sed -i 's|../img/|img/|g' _site/*.html _site/styless.css
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
